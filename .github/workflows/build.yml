name: Build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - run: npx nx affected -t build lint --parallel=3
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: node --test deployment/test/infrastructure.test.cjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: false
          load: true
          tags: platform-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test runtime image
        shell: bash
        run: |
          set -euo pipefail
          id=$(docker run --detach --publish 127.0.0.1:3000:3000 \
            --env OTEL_SDK_DISABLED=true \
            --env PLUGIN_CATALOG_PATH=/etc/platform/plugins.yaml \
            --mount "type=bind,source=$GITHUB_WORKSPACE/environments/dev/plugins.yaml,target=/etc/platform/plugins.yaml,readonly" \
            platform-runtime:ci)
          trap 'docker logs "$id"; docker rm --force "$id" > /dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
