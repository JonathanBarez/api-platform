name: Release runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: runtime-promotion
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint test --parallel=3
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: node --test deployment/test/infrastructure.test.cjs
      - id: name
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/api-platform-runtime" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.repository }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: reference
        env:
          REPOSITORY: ${{ steps.name.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
  dev:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.image.outputs.image }}
      source_sha: ${{ github.sha }}
  qa:
    needs: [image, dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
      image: ${{ needs.image.outputs.image }}
      source_sha: ${{ github.sha }}
  staging:
    needs: [image, qa]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
      source_sha: ${{ github.sha }}
  preprod:
    needs: [image, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preprod
      image: ${{ needs.image.outputs.image }}
      source_sha: ${{ github.sha }}
  prod:
    needs: [image, preprod]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image: ${{ needs.image.outputs.image }}
      source_sha: ${{ github.sha }}
