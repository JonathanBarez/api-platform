apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform-runtime.name" . }}
  labels:
    {{- include "platform-runtime.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform-runtime.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
