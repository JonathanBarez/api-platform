apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-runtime.name" . }}
  labels:
    {{- include "platform-runtime.labels" . | nindent 4 }}
data:
  plugins.yaml: |
    {{- required "Supply the environment catalog with --set-file pluginCatalog=environments/<environment>/plugins.yaml" .Values.pluginCatalog | nindent 4 }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
